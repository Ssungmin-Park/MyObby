<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Store Icons</title>
<style>
  body { margin: 0; padding: 16px; background: #222; display: flex; flex-wrap: wrap; gap: 12px; }
  canvas { width: 256px; height: 256px; border-radius: 12px; }
</style>
</head>
<body>
<script>
const ICONS = [
  { file: "pass-double-income", emoji: "💰", badge: "x2", label: "수입 2배", c1: "#ffd45a", c2: "#c9781a", badgeColor: "#fff3b0" },
  { file: "pass-vip-base", emoji: "👑", badge: "VIP", label: "VIP 기지", c1: "#b07cff", c2: "#4a2a8c", badgeColor: "#ffe27a" },
  { file: "pass-offline-boost", emoji: "🌙", badge: "8h", label: "오프라인 수입", c1: "#5f86e8", c2: "#1a2350", badgeColor: "#ffe9a6" },
  { file: "product-emp-pack", emoji: "⚡", badge: "x5", label: "EMP 5개", c1: "#5fe3ff", c2: "#1569a8", badgeColor: "#ffffff" },
  { file: "product-instant-shield", emoji: "🛡️", badge: "", label: "즉시 방어막", c1: "#5ff0c8", c2: "#127066", badgeColor: "#ffffff" },
  { file: "product-rare-rain", emoji: "🤖", badge: "", label: "희귀 로봇 비", c1: "#ff7ad9", c2: "#5a1f8c", badgeColor: "#ffffff", sparkles: true },
  // 방망이 창 게임패스 (B-42). corner = 왼쪽 위 작은 방망이 표시
  { file: "pass-bat-growth", emoji: "🏏", badge: "x2", label: "방망이 성장 2배", c1: "#ffb35a", c2: "#7a3a12", badgeColor: "#fff3b0", sparkles: true },
  { file: "pass-bat-wrench", emoji: "🔧", badge: "", label: "렌치 방망이", c1: "#ffc27a", c2: "#4a5260", badgeColor: "#ffffff", corner: "🏏" },
  { file: "pass-bat-candy", emoji: "🍭", badge: "", label: "사탕 방망이", c1: "#ffb0d8", c2: "#a3245c", badgeColor: "#ffffff", corner: "🏏" },
  { file: "pass-bat-guitar", emoji: "🎸", badge: "", label: "기타 방망이", c1: "#ff8a6a", c2: "#5a1418", badgeColor: "#ffffff", corner: "🏏" },
  { file: "pass-bat-lightning", emoji: "⚡", badge: "", label: "번개 방망이", c1: "#8fe6ff", c2: "#1a2a6a", badgeColor: "#ffffff", corner: "🏏", sparkles: true },
];

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw(icon) {
  const S = 512;
  const canvas = document.createElement("canvas");
  canvas.width = S; canvas.height = S;
  const ctx = canvas.getContext("2d");

  // 배경: 가운데가 밝은 원형 그라데이션
  const bg = ctx.createRadialGradient(S / 2, S * 0.42, 40, S / 2, S / 2, S * 0.75);
  bg.addColorStop(0, icon.c1);
  bg.addColorStop(1, icon.c2);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, S, S);

  // 고물상 느낌: 아래쪽 비스듬한 경고 줄무늬
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.fillStyle = "#000";
  for (let x = -S; x < S * 2; x += 56) {
    ctx.beginPath();
    ctx.moveTo(x, S); ctx.lineTo(x + 28, S); ctx.lineTo(x + 28 + 90, S - 90); ctx.lineTo(x + 90, S - 90);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 빛줄기
  ctx.save();
  ctx.translate(S / 2, S * 0.42);
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 12; i++) {
    ctx.rotate(Math.PI / 6);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-22, -S); ctx.lineTo(22, -S); ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // 큰 이모지
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "250px 'Segoe UI Emoji'";
  ctx.shadowColor = "rgba(0,0,0,0.45)";
  ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.fillText(icon.emoji, S / 2, S * 0.42);
  ctx.shadowColor = "transparent";

  // 반짝이 (희귀 로봇 비)
  if (icon.sparkles) {
    ctx.font = "78px 'Segoe UI Emoji'";
    [[110, 110], [400, 95], [95, 300], [420, 290], [255, 60]].forEach(([x, y]) => ctx.fillText("✨", x, y));
  }

  // 왼쪽 위 작은 표시 (방망이 꾸미기)
  if (icon.corner) {
    ctx.save();
    ctx.translate(S * 0.2, S * 0.18);
    ctx.rotate(-0.5);
    ctx.font = "110px 'Segoe UI Emoji'";
    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5;
    ctx.fillText(icon.corner, 0, 0);
    ctx.restore();
  }

  // 오른쪽 위 배지 (x2, VIP 등)
  if (icon.badge) {
    ctx.save();
    ctx.translate(S * 0.76, S * 0.2);
    ctx.rotate(-0.18);
    ctx.font = "900 92px 'Malgun Gothic', 'Segoe UI', sans-serif";
    ctx.lineJoin = "round";
    ctx.lineWidth = 16; ctx.strokeStyle = "#2a1a08";
    ctx.strokeText(icon.badge, 0, 0);
    ctx.fillStyle = icon.badgeColor;
    ctx.fillText(icon.badge, 0, 0);
    ctx.restore();
  }

  // 아래 이름표
  const pillW = S * 0.86, pillH = 92, pillX = (S - pillW) / 2, pillY = S - pillH - 26;
  roundRect(ctx, pillX, pillY, pillW, pillH, 30);
  ctx.fillStyle = "rgba(20, 22, 28, 0.82)";
  ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.stroke();
  let size = 62;
  ctx.font = `bold ${size}px 'Malgun Gothic', sans-serif`;
  while (ctx.measureText(icon.label).width > pillW - 40) { size -= 2; ctx.font = `bold ${size}px 'Malgun Gothic', sans-serif`; }
  ctx.fillStyle = "#ffffff";
  ctx.fillText(icon.label, S / 2, pillY + pillH / 2 + 3);

  // 테두리
  ctx.lineWidth = 14; ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.strokeRect(7, 7, S - 14, S - 14);

  document.body.appendChild(canvas);
  return canvas.toDataURL("image/png");
}

window.icons = {};
document.fonts.ready.then(() => {
  for (const icon of ICONS) window.icons[icon.file] = draw(icon);
  window.iconsReady = true;
});
</script>
</body>
</html>
