<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Thumbnails</title>
<style>
  body { margin: 0; padding: 12px; background: #222; display: flex; flex-wrap: wrap; gap: 10px; }
  canvas { width: 384px; height: 216px; }
</style>
</head>
<body>
<script>
// 썸네일 1920×1080: Studio 캡처를 가로 16:9로 잘라 키우고, 짧은 문구를 얹는다
const W = 1920, H = 1080;
const SHOTS = [
  { file: "thumb-1-overview", src: "1.jpg", focus: 0.32, title: "로봇 고물상 타이쿤", sub: "로봇을 사고 · 지키고 · 훔쳐라!" },
  { file: "thumb-2-belt", src: "2.jpg", focus: 0.42, title: "컨베이어 위 로봇을 먼저 사라!", sub: "희귀·전설·신화 로봇 18종" },
  { file: "thumb-3-base", src: "3.jpg", focus: 0.38, title: "내 기지를 로봇으로 가득!", sub: "방어막 · 경보기 · 레이저 울타리" },
  { file: "thumb-4-giant", src: "4.jpg", focus: 0.30, title: "다 같이 거대 로봇 완성!", sub: "서버 전체 수입 x2" },
];

function load(src) {
  return new Promise((ok, fail) => { const img = new Image(); img.onload = () => ok(img); img.onerror = fail; img.src = src; });
}

function draw(shot, img) {
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  // 가로를 꽉 채우고 위아래는 focus 위치에서 자른다
  const scale = W / img.width;
  const drawH = img.height * scale;
  const y = -(drawH - H) * shot.focus;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, y, W, drawH);

  // 아래쪽 어둡게 (글씨가 잘 보이게)
  const shade = ctx.createLinearGradient(0, H * 0.55, 0, H);
  shade.addColorStop(0, "rgba(0,0,0,0)");
  shade.addColorStop(1, "rgba(0,0,0,0.72)");
  ctx.fillStyle = shade;
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.lineJoin = "round";
  // 제목
  let size = 120;
  ctx.font = `900 ${size}px 'Malgun Gothic', sans-serif`;
  while (ctx.measureText(shot.title).width > W - 160) { size -= 4; ctx.font = `900 ${size}px 'Malgun Gothic', sans-serif`; }
  ctx.lineWidth = 22; ctx.strokeStyle = "#1c1210";
  ctx.strokeText(shot.title, 80, H - 150);
  const gold = ctx.createLinearGradient(0, H - 260, 0, H - 140);
  gold.addColorStop(0, "#fff3a8"); gold.addColorStop(0.6, "#ffc93c"); gold.addColorStop(1, "#e08a1a");
  ctx.fillStyle = gold;
  ctx.fillText(shot.title, 80, H - 150);
  // 부제
  ctx.font = "bold 62px 'Malgun Gothic', sans-serif";
  ctx.lineWidth = 12; ctx.strokeStyle = "#1c1210";
  ctx.strokeText(shot.sub, 86, H - 66);
  ctx.fillStyle = "#ffffff";
  ctx.fillText(shot.sub, 86, H - 66);

  document.body.appendChild(canvas);
  return canvas.toDataURL("image/png");
}

window.thumbs = {};
document.fonts.ready.then(async () => {
  for (const shot of SHOTS) {
    const img = await load(shot.src);
    window.thumbs[shot.file] = draw(shot, img);
  }
  window.thumbsReady = true;
});
</script>
</body>
</html>
